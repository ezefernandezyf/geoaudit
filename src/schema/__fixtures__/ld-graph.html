<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@graph JSON-LD</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Acme",
            "url": "https://acme.example"
          },
          {
            "@type": "WebSite",
            "name": "Acme",
            "url": "https://acme.example",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://acme.example/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <h1>Acme</h1>
    <p>A single @graph block with two nodes.</p>
  </body>
</html>
