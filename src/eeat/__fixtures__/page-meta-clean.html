<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clean heading hierarchy</title>
  </head>
  <body>
    <main>
      <article>
        <h1>Title</h1>
        <h2>Section A</h2>
        <p>One paragraph about section A.</p>
        <h2>Section B</h2>
        <p>Another paragraph about section B.</p>
        <h3>Subsection</h3>
        <p>Details nested under section B.</p>
      </article>
    </main>
  </body>
</html>
