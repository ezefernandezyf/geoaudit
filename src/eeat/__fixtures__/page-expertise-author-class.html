<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Expertise: class-based author byline only</title>
  </head>
  <body>
    <main>
      <article>
        <h1>Reflections on measuring semantic relevance</h1>
        <span class="author">Mario Rossi</span>
        <p>Measuring relevance is harder than it looks in practice.</p>
      </article>
    </main>
  </body>
</html>
