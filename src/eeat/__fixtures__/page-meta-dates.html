<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Freshness via JSON-LD Article</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": "Freshness test",
        "datePublished": "2025-03-15",
        "dateModified": "2025-06-01"
      }
    </script>
  </head>
  <body>
    <main>
      <article>
        <h1>Freshness test</h1>
        <p>This article carries structured publication dates.</p>
      </article>
    </main>
  </body>
</html>
